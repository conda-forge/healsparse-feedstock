{% set name = "healsparse" %}
{% set version = "1.14.0" %}
{% set sha256 = "60e94c8a12ca3af80cfbba7b7b11c30be1c6b5585132dd9f8ea93c7935887198" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/healsparse-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools_scm
    - setuptools_scm_git_archive
    - setuptools
  run:
    - astropy-base
    - hpgeom >=1.2.0
    - numpy
    - python >={{ python_min }}
    - rustfits >=0.1.7

test:
  imports:
    - healsparse
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/lsstdesc/healsparse
  summary: Sparse healpix maps and geometry library
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE

  description: |
    HealSparse is a sparse implementation of HEALPix in Python.
    HealSparse is a pure Python library that sits on top of
    numpy and healpy and is designed to avoid storing full
    sky maps in case of partial coverage, including easy
    reading of sub-maps. This reduces the overall memory
    footprint allowing maps to be rendered at arcsecond
    resolution while keeping the familiarity and power of
    healpy.
  doc_url: https://healsparse.readthedocs.io
  dev_url: https://github.com/lsstdesc/healsparse

extra:
  recipe-maintainers:
    - erykoff
